<!-- client-login.html - 登录/注册页 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>登录 / 注册</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }

    /* 页面进入淡入上移动画 */
    .fade-in-up {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .fade-in-up.delay-1 { animation-delay: 0.05s; }
    .fade-in-up.delay-2 { animation-delay: 0.1s; }
    .fade-in-up.delay-3 { animation-delay: 0.15s; }
    .fade-in-up.delay-4 { animation-delay: 0.2s; }
    .fade-in-up.delay-5 { animation-delay: 0.25s; }
    .fade-in-up.delay-6 { animation-delay: 0.3s; }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 切换动画 */
    .switch-enter-active,
    .switch-leave-active {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: absolute;
      width: 100%;
    }
    .switch-enter-from { opacity: 0; transform: translateX(20px); }
    .switch-leave-to { opacity: 0; transform: translateX(-20px); }

    /* 输入框焦点过渡 */
    .input-field {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .input-field:focus {
      border-color: #1a1a1a;
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
    }

    /* 按钮点击缩放 */
    .btn-press {
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-press:active {
      transform: scale(0.95);
      opacity: 0.85;
    }

    /* 错误提示淡入 */
    .error-msg {
      transition: all 0.3s ease;
    }

    /* 加载旋转 */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      animation: spin 0.8s linear infinite;
    }

    /* 底部安全区 */
    .pb-safe {
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-white min-h-screen">
  <div id="app">
    <div class="min-h-screen flex flex-col justify-center px-6 max-w-md mx-auto">

      <!-- 标题区 -->
      <div class="fade-in-up mb-10">
        <h1 class="text-2xl font-semibold text-gray-900 tracking-tight">
          {{ isLogin ? '欢迎回来' : '创建账号' }}
        </h1>
        <p class="text-gray-500 mt-2 text-sm fade-in-up delay-1">
          {{ isLogin ? '登录以继续使用护航服务' : '注册成为护航平台用户' }}
        </p>
      </div>

      <!-- 表单区（带切换动画） -->
      <div class="relative flex-1">
        <transition name="switch" mode="out-in">
          <div :key="isLogin ? 'login' : 'register'">

            <!-- 手机号 -->
            <div class="mb-5 fade-in-up delay-2">
              <label class="block text-sm font-medium text-gray-700 mb-2">手机号</label>
              <input
                v-model="phone"
                type="tel"
                maxlength="11"
                placeholder="请输入 11 位手机号"
                class="input-field w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 outline-none text-base"
                :class="{ 'border-red-300 bg-red-50/50': phoneError }"
                @input="phoneError = ''; phone = phone.replace(/\D/g, '').slice(0, 11)"
              />
              <p v-if="phoneError" class="error-msg text-red-500 text-xs mt-1.5">{{ phoneError }}</p>
            </div>

            <!-- 密码 -->
            <div class="mb-5 fade-in-up delay-3 relative">
              <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
              <input
                v-model="password"
                :type="showPassword ? 'text' : 'password'"
                placeholder="请输入密码（至少 6 位）"
                class="input-field w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 outline-none text-base pr-16"
                :class="{ 'border-red-300 bg-red-50/50': passwordError }"
                @input="passwordError = ''"
              />
              <button
                type="button"
                @click="showPassword = !showPassword"
                class="absolute right-4 text-gray-400 hover:text-gray-600 text-sm"
                style="bottom: 14px;"
              >
                {{ showPassword ? '隐藏' : '显示' }}
              </button>
              <p v-if="passwordError" class="error-msg text-red-500 text-xs mt-1.5">{{ passwordError }}</p>
            </div>

            <!-- 通用错误提示 -->
            <div v-if="generalError" class="mb-4 fade-in-up bg-red-50 border border-red-100 rounded-lg px-4 py-3">
              <p class="text-red-600 text-sm">{{ generalError }}</p>
            </div>

            <!-- 主按钮 -->
            <button
              @click="handleSubmit"
              :disabled="loading"
              class="btn-press w-full py-3.5 bg-gray-900 text-white rounded-xl font-medium text-base mb-4 disabled:opacity-50 disabled:cursor-not-allowed fade-in-up delay-4"
            >
              <span v-if="loading" class="inline-flex items-center gap-2">
                <svg class="spinner w-5 h-5" viewBox="0 0 24 24" fill="none">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                处理中...
              </span>
              <span v-else>{{ isLogin ? '登 录' : '注 册' }}</span>
            </button>

            <!-- 切换按钮 -->
            <p class="text-center text-sm text-gray-500 fade-in-up delay-5">
              {{ isLogin ? '还没有账号？' : '已有账号？' }}
              <button
                @click="toggleMode"
                class="text-gray-900 font-medium hover:underline ml-1"
              >
                {{ isLogin ? '立即注册' : '立即登录' }}
              </button>
            </p>

          </div>
        </transition>
      </div>

      <!-- 版权页脚 -->
      <div class="text-center pt-8 pb-safe fade-in-up delay-6">
        <p class="text-sm text-gray-700 font-medium mb-1">希皓电竞</p>
        <p class="text-xs text-gray-400 mb-1">希皓网游 提供技术支持</p>
        <p class="text-[11px] text-gray-300 leading-relaxed">
          Copyright © 2026 希皓电竞 All Rights Reserved.<br>
          最终解释权归希皓电竞所有。
        </p>
      </div>

    </div>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    const SUPABASE_URL = 'https://cvcerkgcstvnqiqsmkj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_H9iztdbCiT4xu566vfIQ8Q_d66u1_aQ';
    const EMAIL_DOMAIN = '@h5.club';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    createApp({
      setup() {
        const isLogin = ref(true);
        const phone = ref('');
        const password = ref('');
        const showPassword = ref(false);
        const loading = ref(false);
        const phoneError = ref('');
        const passwordError = ref('');
        const generalError = ref('');

        // 校验手机号
        const validatePhone = () => {
          if (!phone.value) {
            phoneError.value = '请输入手机号';
            return false;
          }
          if (!/^1[3-9]\d{9}$/.test(phone.value)) {
            phoneError.value = '请输入正确的 11 位手机号';
            return false;
          }
          phoneError.value = '';
          return true;
        };

        // 校验密码
        const validatePassword = () => {
          if (!password.value) {
            passwordError.value = '请输入密码';
            return false;
          }
          if (password.value.length < 6) {
            passwordError.value = '密码至少 6 位';
            return false;
          }
          passwordError.value = '';
          return true;
        };

        // 切换登录/注册
        const toggleMode = () => {
          isLogin.value = !isLogin.value;
          generalError.value = '';
          phoneError.value = '';
          passwordError.value = '';
        };

        // 提交处理
        const handleSubmit = async () => {
          generalError.value = '';

          const phoneOk = validatePhone();
          const pwdOk = validatePassword();
          if (!phoneOk || !pwdOk) return;

          loading.value = true;
          const email = phone.value + EMAIL_DOMAIN;

          try {
            if (isLogin.value) {
              // 登录
              const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password.value
              });

              if (error) throw error;

              saveSession(data.session);
              redirectHome();

            } else {
              // 注册
              const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password.value,
                options: {
                  data: { phone: phone.value }
                }
              });

              if (error) throw error;

              // 注册成功且 session 存在（自动登录）
              if (data.session) {
                saveSession(data.session);
                redirectHome();
              } else {
                generalError.value = '注册成功，请登录';
                isLogin.value = true;
              }
            }
          } catch (err) {
            let msg = err.message || '操作失败，请重试';
            // 常见错误友好化
            if (msg.includes('Invalid login credentials')) {
              msg = '手机号或密码错误';
            } else if (msg.includes('already registered') || msg.includes('already exists')) {
              msg = '该手机号已注册，请直接登录';
            } else if (msg.includes('weak password')) {
              msg = '密码强度不足，请设置更复杂的密码';
            }
            generalError.value = msg;
          } finally {
            loading.value = false;
          }
        };

        // 保存会话
        const saveSession = (session) => {
          localStorage.setItem('access_token', session.access_token);
          localStorage.setItem('user_id', session.user.id);
          localStorage.setItem('user_phone', phone.value);
        };

        // 跳转首页
        const redirectHome = () => {
          // 平滑淡出后跳转
          document.body.style.opacity = '0';
          document.body.style.transition = 'opacity 0.3s ease';
          setTimeout(() => {
            window.location.href = 'client-home.html';
          }, 250);
        };

        // 页面加载时检查登录状态
        onMounted(async () => {
          const token = localStorage.getItem('access_token');
          if (token) {
            // 验证 token 是否有效
            const { data: { user }, error } = await supabase.auth.getUser(token);
            if (user && !error) {
              redirectHome();
              return;
            }
            // token 无效，清除
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_id');
            localStorage.removeItem('user_phone');
          }
        });

        return {
          isLogin,
          phone,
          password,
          showPassword,
          loading,
          phoneError,
          passwordError,
          generalError,
          toggleMode,
          handleSubmit
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
