<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>卡密充值</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }

    /* 入场动画 */
    .fade-in-up {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .fade-in-up.d1 { animation-delay: 0.05s; }
    .fade-in-up.d2 { animation-delay: 0.1s; }
    .fade-in-up.d3 { animation-delay: 0.15s; }
    .fade-in-up.d4 { animation-delay: 0.2s; }
    .fade-in-up.d5 { animation-delay: 0.25s; }
    .fade-in-up.d6 { animation-delay: 0.3s; }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 输入框焦点过渡 */
    .input-field {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .input-field:focus {
      border-color: #1a1a1a;
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
    }

    /* 按钮缩放 */
    .btn-press {
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-press:active {
      transform: scale(0.95);
      opacity: 0.85;
    }

    /* 弹窗动画 */
    .modal-overlay {
      animation: fadeIn 0.2s ease;
    }
    .modal-content {
      animation: modalIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* 加载旋转 */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      animation: spin 0.8s linear infinite;
    }

    /* 成功对勾 */
    .success-check {
      animation: checkIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes checkIn {
      0% { transform: scale(0); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 底部安全区 */
    .pb-safe {
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-white min-h-screen pb-safe">
  <div id="app">

    <!-- 顶部导航 -->
    <div class="flex items-center px-4 pt-12 pb-4 fade-in-up">
      <button
        @click="goBack"
        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 btn-press"
      >
        <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <h1 class="flex-1 text-center text-lg font-semibold text-gray-900 pr-10">卡密充值</h1>
    </div>

    <!-- 主体内容 -->
    <div class="px-6 pt-6">

      <!-- 图标区 -->
      <div class="text-center mb-8 fade-in-up d1">
        <div class="w-20 h-20 mx-auto bg-gray-900 rounded-2xl flex items-center justify-center mb-4">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path>
          </svg>
        </div>
        <h2 class="text-xl font-semibold text-gray-900 mb-2">使用卡密充值</h2>
        <p class="text-gray-500 text-sm">输入卡密即可充值到账户余额</p>
      </div>

      <!-- 卡密输入 -->
      <div class="mb-6 fade-in-up d2">
        <label class="block text-sm font-medium text-gray-700 mb-2">卡密</label>
        <input
          v-model="cardCode"
          type="text"
          placeholder="请输入卡密"
          class="input-field w-full px-4 py-4 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 outline-none text-base text-center font-mono tracking-wider"
          :class="{ 'border-red-300 bg-red-50/50': errorMsg }"
          @input="errorMsg = ''"
          @keyup.enter="handleRecharge"
        />
      </div>

      <!-- 错误提示 -->
      <div
        v-if="errorMsg"
        class="mb-4 bg-red-50 border border-red-100 rounded-xl px-4 py-3 fade-in-up d3"
      >
        <p class="text-red-600 text-sm text-center">{{ errorMsg }}</p>
      </div>

      <!-- 充值按钮 -->
      <button
        @click="handleRecharge"
        :disabled="loading || !cardCode.trim()"
        class="btn-press w-full py-4 bg-gray-900 text-white rounded-xl font-medium text-base disabled:opacity-50 disabled:cursor-not-allowed fade-in-up d4"
      >
        <span v-if="loading" class="inline-flex items-center gap-2">
          <svg class="spinner w-5 h-5" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          充值中...
        </span>
        <span v-else>确认充值</span>
      </button>

      <!-- 提示文字 -->
      <p class="text-center text-xs text-gray-400 mt-6 fade-in-up d5">
        卡密请联系客服购买
      </p>

    </div>

    <!-- 版权页脚 -->
    <div class="text-center px-6 pt-8 fade-in-up d6 pb-safe">
      <p class="text-sm text-gray-700 font-medium mb-1">希皓电竞</p>
      <p class="text-xs text-gray-400 mb-1">希皓网游 提供技术支持</p>
      <p class="text-[11px] text-gray-300 leading-relaxed">
        Copyright © 2026 希皓电竞 All Rights Reserved.<br>
        最终解释权归希皓电竞所有。
      </p>
    </div>

    <!-- 成功弹窗 -->
    <div
      v-if="showSuccess"
      class="fixed inset-0 z-50 flex items-center justify-center px-6 modal-overlay"
      style="background: rgba(0,0,0,0.4);"
    >
      <div class="modal-content bg-white rounded-3xl p-8 w-full max-w-sm text-center">
        <div class="success-check w-16 h-16 mx-auto mb-4 bg-green-50 rounded-full flex items-center justify-center">
          <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <h3 class="text-lg font-semibold text-gray-900 mb-2">充值成功</h3>
        <p class="text-gray-500 text-sm mb-1">到账金额</p>
        <p class="text-3xl font-bold text-gray-900 mb-6">
          +¥{{ successAmount.toFixed(2) }}
        </p>
        <button
          @click="showSuccess = false"
          class="btn-press w-full py-3 bg-gray-900 text-white rounded-xl font-medium"
        >
          确定
        </button>
      </div>
    </div>

  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    const SUPABASE_URL = 'https://cvcerkgcstvnqiqsmkj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_H9iztdbCiT4xu566vfIQ8Q_d66u1_aQ';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    createApp({
      setup() {
        const cardCode = ref('');
        const loading = ref(false);
        const errorMsg = ref('');
        const showSuccess = ref(false);
        const successAmount = ref(0);

        // 检查登录
        const checkAuth = () => {
          const token = localStorage.getItem('access_token');
          if (!token) {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.3s ease';
            setTimeout(() => {
              window.location.href = 'client-login.html';
            }, 200);
            return false;
          }
          return true;
        };

        // 返回
        const goBack = () => {
          window.location.href = 'client-home.html';
        };

        // 充值
        const handleRecharge = async () => {
          const code = cardCode.value.trim();
          if (!code) {
            errorMsg.value = '请输入卡密';
            return;
          }

          errorMsg.value = '';
          loading.value = true;

          try {
            const { data, error } = await supabase.rpc('rpc_recharge_balance', {
              card_code: code
            });

            if (error) throw error;

            // 充值成功
            successAmount.value = data.amount || 0;
            showSuccess.value = true;
            cardCode.value = '';

          } catch (err) {
            let msg = err.message || '充值失败，请重试';
            // 常见错误友好化
            if (msg.includes('卡密不存在')) msg = '卡密不存在，请检查后重新输入';
            else if (msg.includes('已使用')) msg = '该卡密已使用';
            errorMsg.value = msg;
          } finally {
            loading.value = false;
          }
        };

        onMounted(() => {
          checkAuth();
        });

        return {
          cardCode,
          loading,
          errorMsg,
          showSuccess,
          successAmount,
          goBack,
          handleRecharge
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
