<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的订单</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }

    /* 入场动画 */
    .fade-in-up {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .fade-in-up.d1 { animation-delay: 0.03s; }
    .fade-in-up.d2 { animation-delay: 0.08s; }
    .fade-in-up.d3 { animation-delay: 0.13s; }
    .fade-in-up.d4 { animation-delay: 0.18s; }
    .fade-in-up.d5 { animation-delay: 0.23s; }
    .fade-in-up.d6 { animation-delay: 0.28s; }
    .fade-in-up.d7 { animation-delay: 0.33s; }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 订单卡片点击反馈 */
    .order-card {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .order-card:active {
      transform: scale(0.98);
      background-color: #f9fafb;
    }

    /* 按钮缩放 */
    .btn-press {
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-press:active {
      transform: scale(0.95);
    }

    /* 骨架屏 */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    /* 底部安全区 */
    .pb-safe {
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-gray-50/50 min-h-screen pb-safe">
  <div id="app">

    <!-- 顶部导航栏 -->
    <div class="bg-white sticky top-0 z-10 border-b border-gray-100 fade-in-up">
      <div class="flex items-center px-4 h-14">
        <button
          @click="goBack"
          class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 btn-press -ml-2"
        >
          <svg class="w-5 h-5 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <h1 class="flex-1 text-center text-base font-semibold text-gray-900 pr-10">我的订单</h1>
      </div>
    </div>

    <!-- 订单列表 -->
    <div class="px-4 py-4">

      <!-- 加载骨架 -->
      <div v-if="loading" class="space-y-3">
        <div v-for="i in 4" :key="i" class="bg-white rounded-2xl p-5 border border-gray-100 fade-in-up" :class="'d' + i">
          <div class="flex justify-between mb-3">
            <div class="skeleton h-4 w-28"></div>
            <div class="skeleton h-4 w-16"></div>
          </div>
          <div class="skeleton h-5 w-48 mb-2"></div>
          <div class="skeleton h-4 w-32 mb-3"></div>
          <div class="skeleton h-3 w-24"></div>
        </div>
      </div>

      <!-- 空状态 -->
      <div v-else-if="orders.length === 0" class="pt-24 text-center fade-in-up d2">
        <div class="text-5xl mb-4">📋</div>
        <h3 class="text-lg font-medium text-gray-900 mb-2">暂无订单</h3>
        <p class="text-gray-500 text-sm mb-8">去首页挑选一个护航套餐吧</p>
        <button
          @click="goHome"
          class="btn-press inline-block px-8 py-3 bg-gray-900 text-white rounded-xl font-medium text-sm"
        >
          去下单
        </button>
      </div>

      <!-- 订单卡片列表 -->
      <div v-else class="space-y-3">
        <div
          v-for="(order, idx) in orders"
          :key="order.id"
          class="order-card bg-white rounded-2xl p-5 border border-gray-100 cursor-pointer fade-in-up"
          :class="'d' + Math.min((idx % 5) + 2, 6)"
          @click="goDetail(order.id)"
        >
          <!-- 顶部：订单号 + 状态 -->
          <div class="flex items-center justify-between mb-3">
            <span class="text-xs text-gray-400 font-mono">{{ order.order_no }}</span>
            <span
              class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium"
              :class="statusClass(order.status)"
            >
              {{ statusText(order.status) }}
            </span>
          </div>

          <!-- 套餐名称 -->
          <h3 class="text-base font-semibold text-gray-900 mb-1.5">{{ order.package_name }}</h3>

          <!-- 金额 -->
          <div class="flex items-baseline gap-1 mb-3">
            <span class="text-xl font-bold text-gray-900">¥{{ order.amount.toFixed(2) }}</span>
          </div>

          <!-- 底部：下单时间 + 箭头 -->
          <div class="flex items-center justify-between pt-3 border-t border-gray-50">
            <span class="text-xs text-gray-400">{{ formatTime(order.created_at) }}</span>
            <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
          </div>
        </div>
      </div>

    </div>

    <!-- 版权页脚 -->
    <div class="text-center px-6 pt-6 fade-in-up d7">
      <p class="text-sm text-gray-700 font-medium mb-1">希皓电竞</p>
      <p class="text-xs text-gray-400 mb-1">希皓网游 提供技术支持</p>
      <p class="text-[11px] text-gray-300 leading-relaxed">
        Copyright © 2026 希皓电竞 All Rights Reserved.<br>
        最终解释权归希皓电竞所有。
      </p>
    </div>

  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    const SUPABASE_URL = 'https://cvcerkgcstvnqiqsmkj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_H9iztdbCiT4xu566vfIQ8Q_d66u1_aQ';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 状态中文映射
    const STATUS_MAP = {
      'pending_accept': { text: '待接单', class: 'bg-yellow-50 text-yellow-700' },
      'accepted': { text: '已接单', class: 'bg-blue-50 text-blue-700' },
      'in_progress': { text: '服务中', class: 'bg-purple-50 text-purple-700' },
      'completed_by_booster': { text: '待确认', class: 'bg-orange-50 text-orange-700' },
      'confirmed': { text: '已确认', class: 'bg-green-50 text-green-700' },
      'settled': { text: '已完成', class: 'bg-green-50 text-green-700' },
      'cancelled': { text: '已取消', class: 'bg-gray-100 text-gray-500' }
    };

    createApp({
      setup() {
        const orders = ref([]);
        const loading = ref(true);

        // 检查登录
        const checkAuth = () => {
          const token = localStorage.getItem('access_token');
          if (!token) {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.3s ease';
            setTimeout(() => {
              window.location.href = 'client-login.html';
            }, 200);
            return false;
          }
          return true;
        };

        // 状态中文
        const statusText = (status) => {
          return STATUS_MAP[status]?.text || status;
        };

        // 状态样式
        const statusClass = (status) => {
          return STATUS_MAP[status]?.class || 'bg-gray-100 text-gray-500';
        };

        // 格式化时间
        const formatTime = (timeStr) => {
          if (!timeStr) return '';
          const d = new Date(timeStr);
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          const h = String(d.getHours()).padStart(2, '0');
          const min = String(d.getMinutes()).padStart(2, '0');
          return `${y}-${m}-${day} ${h}:${min}`;
        };

        // 获取订单列表
        const fetchOrders = async () => {
          loading.value = true;
          try {
            const userId = localStorage.getItem('user_id');
            const { data, error } = await supabase
              .from('orders')
              .select('id, order_no, package_name, amount, status, created_at')
              .eq('client_id', userId)
              .order('created_at', { ascending: false });

            if (error) throw error;
            orders.value = data || [];
          } catch (err) {
            console.error('获取订单失败:', err);
            orders.value = [];
          } finally {
            loading.value = false;
          }
        };

        // 返回首页
        const goBack = () => {
          window.location.href = 'client-home.html';
        };

        const goHome = () => {
          window.location.href = 'client-home.html';
        };

        // 跳转订单详情
        const goDetail = (orderId) => {
          window.location.href = 'client-order-detail.html?id=' + orderId;
        };

        onMounted(() => {
          if (!checkAuth()) return;
          fetchOrders();
        });

        return {
          orders,
          loading,
          statusText,
          statusClass,
          formatTime,
          goBack,
          goHome,
          goDetail
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
