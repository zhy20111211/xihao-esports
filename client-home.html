<!-- client-home.html - 老板端首页 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>首页</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/tailwindcss/3.4.1/tailwind.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/supabase-js/2.39.3/supabase.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }

    /* 入场动画 */
    .fade-in-up {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .fade-in-up.d1 { animation-delay: 0.03s; }
    .fade-in-up.d2 { animation-delay: 0.08s; }
    .fade-in-up.d3 { animation-delay: 0.13s; }
    .fade-in-up.d4 { animation-delay: 0.18s; }
    .fade-in-up.d5 { animation-delay: 0.23s; }
    .fade-in-up.d6 { animation-delay: 0.28s; }
    .fade-in-up.d7 { animation-delay: 0.33s; }
    .fade-in-up.d8 { animation-delay: 0.38s; }
    .fade-in-up.d9 { animation-delay: 0.43s; }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 卡片悬停/点击效果 */
    .pkg-card {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pkg-card:active {
      transform: scale(0.98);
      background-color: #f9fafb;
    }

    /* 按钮缩放 */
    .btn-press {
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-press:active {
      transform: scale(0.95);
      opacity: 0.85;
    }

    /* 余额数字动效占位 */
    .balance-num {
      font-variant-numeric: tabular-nums;
    }

    /* 骨架屏闪烁 */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    /* 底部安全区 */
    .pb-safe {
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-gray-50/50 min-h-screen pb-44">
  <div id="app">

    <!-- 顶部信息区 -->
    <div class="bg-white px-6 pt-12 pb-6 fade-in-up">
      <div class="flex items-start justify-between">
        <div>
          <p class="text-gray-500 text-sm mb-1">你好，老板 👋</p>
          <h1 class="text-xl font-semibold text-gray-900 balance-num">{{ maskedPhone }}</h1>
        </div>
        <button
          @click="handleLogout"
          class="text-gray-400 text-sm btn-press px-3 py-1.5 rounded-lg hover:bg-gray-100"
        >
          退出
        </button>
      </div>

      <!-- 余额卡片 -->
      <div class="mt-6 bg-gray-900 rounded-2xl p-5 text-white fade-in-up d1">
        <p class="text-gray-400 text-sm mb-1">账户余额</p>
        <div class="flex items-baseline gap-1">
          <span class="text-3xl font-bold balance-num">
            <span v-if="loadingBalance">****</span>
            <span v-else>{{ balance.toFixed(2) }}</span>
          </span>
          <span class="text-gray-400 text-sm">元</span>
        </div>
        <div class="mt-4 flex gap-3">
          <button
            @click="goTopup"
            class="flex-1 py-2.5 bg-white/10 hover:bg-white/20 rounded-xl text-sm font-medium btn-press"
          >
            去充值
          </button>
        </div>
      </div>
    </div>

    <!-- 套餐列表区 -->
    <div class="px-6 py-5">
      <div class="flex items-center justify-between mb-4 fade-in-up d2">
        <h2 class="text-lg font-semibold text-gray-900">护航套餐</h2>
        <span class="text-xs text-gray-400">精选套餐</span>
      </div>

      <!-- 加载骨架 -->
      <div v-if="loadingPackages" class="space-y-3">
        <div v-for="i in 3" :key="i" class="bg-white rounded-2xl p-5 border border-gray-100 fade-in-up" :class="'d' + (i + 2)">
          <div class="skeleton h-5 w-32 mb-3"></div>
          <div class="skeleton h-4 w-48 mb-2"></div>
          <div class="skeleton h-4 w-24"></div>
        </div>
      </div>

      <!-- 空状态 -->
      <div v-else-if="packages.length === 0" class="bg-white rounded-2xl p-12 text-center border border-gray-100 fade-in-up d3">
        <div class="text-4xl mb-3">📦</div>
        <p class="text-gray-500 text-sm">暂无护航套餐</p>
      </div>

      <!-- 套餐卡片列表 -->
      <div v-else class="space-y-3">
        <div
          v-for="(pkg, idx) in packages"
          :key="pkg.id"
          class="pkg-card bg-white rounded-2xl p-5 border border-gray-100 cursor-pointer fade-in-up"
          :class="'d' + (idx + 3)"
          @click="handlePackageClick(pkg)"
        >
          <div class="flex items-start justify-between mb-2">
            <h3 class="text-base font-semibold text-gray-900">{{ pkg.name }}</h3>
            <div class="text-right">
              <span class="text-xl font-bold text-gray-900 balance-num">¥{{ pkg.price.toFixed(0) }}</span>
              <span class="text-xs text-gray-400 block">起</span>
            </div>
          </div>

          <div class="flex flex-wrap gap-2 mb-3">
            <span v-if="pkg.map_name" class="inline-flex items-center px-2.5 py-1 bg-gray-50 text-gray-600 text-xs rounded-full">
              🗺️ {{ pkg.map_name }}
            </span>
            <span v-if="pkg.rounds" class="inline-flex items-center px-2.5 py-1 bg-gray-50 text-gray-600 text-xs rounded-full">
              🎯 {{ pkg.rounds }} 局
            </span>
            <span v-if="pkg.allow_assign" class="inline-flex items-center px-2.5 py-1 bg-gray-50 text-gray-600 text-xs rounded-full">
              👤 可指定打手
            </span>
          </div>

          <p v-if="pkg.guarantee" class="text-sm text-gray-500 line-clamp-1">
            {{ pkg.guarantee }}
          </p>
        </div>
      </div>
    </div>

    <!-- 版权页脚（固定按钮上方） -->
    <div class="text-center px-6 pt-4 fade-in-up d9">
      <p class="text-sm text-gray-700 font-medium mb-1">希皓电竞</p>
      <p class="text-xs text-gray-400 mb-1">希皓网游 提供技术支持</p>
      <p class="text-[11px] text-gray-300 leading-relaxed">
        Copyright © 2026 希皓电竞 All Rights Reserved.<br>
        最终解释权归希皓电竞所有。
      </p>
    </div>

    <!-- 底部按钮区（固定） -->
    <div class="fixed bottom-0 left-0 right-0 px-6 pb-safe pt-4 bg-gradient-to-t from-white via-white to-transparent">
      <div class="max-w-md mx-auto flex gap-3 fade-in-up d8">
        <button
          @click="goTopup"
          class="btn-press flex-1 py-3.5 bg-gray-100 text-gray-900 rounded-xl font-medium text-base"
        >
          去充值
        </button>
        <button
          @click="goOrders"
          class="btn-press flex-1 py-3.5 bg-gray-900 text-white rounded-xl font-medium text-base"
        >
          我的订单
        </button>
      </div>
    </div>

  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const SUPABASE_URL = 'https://cvcerkgcstvnqiqsmkj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_H9iztdbCiT4xu566vfIQ8Q_d66u1_aQ';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    createApp({
      setup() {
        const phone = ref('');
        const balance = ref(0);
        const packages = ref([]);
        const loadingBalance = ref(true);
        const loadingPackages = ref(true);

        // 手机号脱敏
        const maskedPhone = computed(() => {
          if (!phone.value) return '';
          return phone.value.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
        });

        // 检查登录状态
        const checkAuth = () => {
          const token = localStorage.getItem('access_token');
          const userPhone = localStorage.getItem('user_phone');
          if (!token) {
            redirectLogin();
            return false;
          }
          phone.value = userPhone || '';
          return true;
        };

        // 跳回登录页
        const redirectLogin = () => {
          document.body.style.opacity = '0';
          document.body.style.transition = 'opacity 0.3s ease';
          setTimeout(() => {
            window.location.href = 'client-login.html';
          }, 200);
        };

        // 获取用户余额
        const fetchBalance = async () => {
          loadingBalance.value = true;
          try {
            const userId = localStorage.getItem('user_id');
            const { data, error } = await supabase
              .from('profiles')
              .select('balance')
              .eq('id', userId)
              .single();

            if (error) throw error;
            balance.value = data.balance || 0;
          } catch (err) {
            console.error('获取余额失败:', err);
            balance.value = 0;
          } finally {
            loadingBalance.value = false;
          }
        };

        // 获取套餐列表
        const fetchPackages = async () => {
          loadingPackages.value = true;
          try {
            const { data, error } = await supabase
              .from('packages')
              .select('*')
              .eq('status', 'on')
              .order('sort_order', { ascending: true })
              .order('price', { ascending: true });

            if (error) throw error;
            packages.value = data || [];
          } catch (err) {
            console.error('获取套餐失败:', err);
            packages.value = [];
          } finally {
            loadingPackages.value = false;
          }
        };

        // 点击套餐卡片
        const handlePackageClick = (pkg) => {
          // 先预留，后续跳转到下单确认页
          console.log('选中套餐:', pkg.name);
          // window.location.href = 'client-order-create.html?package_id=' + pkg.id;
        };

        // 去充值
        const goTopup = () => {
          window.location.href = 'client-topup.html';
        };

        // 我的订单
        const goOrders = () => {
          window.location.href = 'client-orders.html';
        };

        // 退出登录
        const handleLogout = () => {
          if (!confirm('确定要退出登录吗？')) return;
          supabase.auth.signOut();
          localStorage.removeItem('access_token');
          localStorage.removeItem('user_id');
          localStorage.removeItem('user_phone');
          redirectLogin();
        };

        // 初始化
        onMounted(async () => {
          if (!checkAuth()) return;
          fetchBalance();
          fetchPackages();
        });

        return {
          phone,
          maskedPhone,
          balance,
          packages,
          loadingBalance,
          loadingPackages,
          handlePackageClick,
          goTopup,
          goOrders,
          handleLogout
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
